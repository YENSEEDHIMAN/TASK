<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9;">

    <!-- Navigation Bar -->
    <nav style="background-color: #fff; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); padding: 10px 0;">
        <h1 style="text-align: center; font-size: 40px; color: #ff0000; margin: 0;">TO DO APP</h1>
        <ul style="margin: 0; padding: 0; display: flex; justify-content: center; list-style: none;">
            <li style="margin: 10px 20px;">
                <a href="{% url 'index' %}" style="text-decoration: none; color: #28a745; font-weight: bold;">Task List</a>
            </li>

            <li style="margin: 10px 20px;">
                <a href="{% url 'create_task' %}" style="text-decoration: none; color: #28a745; font-weight: bold;">Create Task</a>
            </li>
            <li style="margin: 10px 20px;">
                <a href="/admin/" style="text-decoration: none; color: #28a745; font-weight: bold;">Admin Login</a>
            </li>
        </ul>
    </nav>

    <hr style="border: none; border-top: 1px solid #ff0000; margin: 20px 0;">

    <!-- Page Title and Content Block -->
    {% block content %}
    {% endblock %}
</body>
</html>
