{% extends 'todoapp/base.html' %}

{% block content %}
    <h2 style="text-align: center; color: #dc3545;">Delete Task</h2>
    <div style="max-width: 600px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center;">
        <p style="color: #555;">Are you sure you want to delete this task?</p>
        <p style="font-weight: bold; color: #333;">{{ task.title }}</p>
        <p style="color: #777;">{{ task.description }}</p>

        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            <button type="submit" style="background-color: #dc3545; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">
                Delete
            </button>
            <a href="{% url 'index' %}" style="text-decoration: none; color: #007BFF; margin-left: 15px;">Cancel</a>
        </form>
    </div>
{% endblock %}
