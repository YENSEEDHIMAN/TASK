{% extends 'todoapp/base.html' %}

{% block content %}
    <h2 style="text-align: center; color: #333;">Create Task</h2>
    <form method="post" style="max-width: 600px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
        {% csrf_token %}
        
        <label style="display: block; margin-bottom: 5px; color: #333;">Title:</label>
        <input type="text" name="title" required style="width: 95%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px;">

        <label style="display: block; margin-bottom: 5px; color: #333;">Description:</label>
        <textarea name="description" required style="width: 95%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea><br><br>

        <button type="submit" style="background-color: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">
            Create
        </button>
    </form>
{% endblock %}
